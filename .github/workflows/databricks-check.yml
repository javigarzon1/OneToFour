name: OneToFour - Databricks check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  databricks-check:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_SERVER_HOSTNAME: dbc-9ebf13e1-da41.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/7bf58be4bdba98ad
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/app/main.py

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q backend/tests

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Start FastAPI
        run: |
          nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/onetoFour-api.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat /tmp/onetoFour-api.log
          exit 1

      - name: Check Databricks through API
        run: |
          set +e
          response=$(curl --silent --show-error --fail-with-body http://127.0.0.1:8000/api/health/databricks)
          status=$?
          echo "HTTP/API exit code: $status"
          echo "Respuesta de Databricks:"
          echo "$response"
          if [ $status -ne 0 ]; then
            echo "La comprobación de Databricks ha fallado. Revisa los logs del servidor para el detalle técnico."
            exit $status
          fi
          echo "$response" | grep -q '"databricks":true'

      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f /tmp/onetoFour-api.log ]; then
            cat /tmp/onetoFour-api.log
          else
            echo "No hay log de FastAPI porque el servidor todavía no llegó a arrancar."
          fi
