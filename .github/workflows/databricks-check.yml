name: OneToFour - Databricks check

on:
  workflow_dispatch:

jobs:
  databricks-check:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_SERVER_HOSTNAME: dbc-9ebf13e1-da41.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/7bf58be4bdba98ad
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/app/main.py

      - name: Start FastAPI
        run: |
          nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/onetoFour-api.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat /tmp/onetoFour-api.log
          exit 1

      - name: Check Databricks through API
        run: |
          response=$(curl --silent --show-error --fail http://127.0.0.1:8000/api/health/databricks)
          echo "$response"
          echo "$response" | grep -q '"databricks":true'

      - name: Check questions endpoint
        run: |
          response=$(curl --silent --show-error --fail "http://127.0.0.1:8000/api/questions?limit=1")
          echo "$response"
          echo "$response" | grep -q '"pregunta"'

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/onetoFour-api.log
