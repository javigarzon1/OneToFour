name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compilar
        run: python -m compileall -q backend/app scripts

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q backend/tests

  database:
    name: SQL (esquema y banco de preguntas en PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGCONNECT: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: "Aplicar esquema y datos (dos veces, debe ser idempotente)"
        run: |
          for i in 1 2; do
            psql "$PGCONNECT" -v ON_ERROR_STOP=1 -q -f sql/postgres/01_schema.sql
            psql "$PGCONNECT" -v ON_ERROR_STOP=1 -q -f sql/postgres/02_seed_preguntas.sql
          done

      - name: Comprobar el banco de preguntas
        run: |
          total=$(psql "$PGCONNECT" -At -c "SELECT COUNT(*) FROM quiz.preguntas")
          echo "Preguntas cargadas: $total"
          test "$total" -ge 100

  frontend:
    name: Frontend (tests y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm run build
